<!DOCTYPE html>
<html lang="as">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chintu's Question 😂</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            text-align: center;

            background: linear-gradient(135deg, #667eea, #764ba2);

            color: white;
        }

        .box {
            width: 90%;
            max-width: 550px;

            padding: 40px 25px;

            background: rgba(255, 255, 255, 0.18);

            border-radius: 30px;

            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);

            backdrop-filter: blur(10px);
        }

        .emoji {
            font-size: 75px;

            animation: bounce 1.5s infinite;
        }

        @keyframes bounce {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }

        h1 {
            font-size: 38px;
            margin-bottom: 25px;
        }

        .question {
            font-size: 27px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        button {
            display: block;

            width: 90%;

            max-width: 400px;

            margin: 15px auto;

            padding: 16px;

            border: none;

            border-radius: 30px;

            font-size: 20px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.06);
        }

        .option-a {
            background: #00e676;
            color: white;
        }

        .option-b {
            background: #ff9800;
            color: white;
        }

        .result {
            display: none;
        }

        .result h2 {
            font-size: 45px;
        }

        .result p {
            font-size: 25px;
        }

        .again {
            background: white;
            color: #764ba2;
        }
    </style>
</head>

<body>

    <div class="box">

        <!-- QUESTION -->

        <div id="question">

            <div class="emoji">
                😂
            </div>

            <h1>Hey Chintu! 😜</h1>

            <div class="question">
                Ki krisa? 🤔
            </div>

            <button class="option-a" onclick="optionA()">
                A — Mal khai ghumolu 😴
            </button>

            <button class="option-b" onclick="optionB()">
                B — Vat khalu de aklai 😂
            </button>

        </div>


        <!-- OPTION A -->

        <div id="answerA" class="result">

            <div class="emoji">
                😎🔥
            </div>

            <h2>MJAAAAAAA 😂🔥</h2>

            <p>
                Mal khai ghumolu nki? 😴😂
            </p>

            <p>
                Life t aru ki lage! 😎
            </p>

            <button class="again" onclick="again()">
                Akou Answer De 😜
            </button>

        </div>


        <!-- OPTION B -->

        <div id="answerB" class="result">

            <div class="emoji">
                😂🍚
            </div>

            <h2>Kali Khaba Lgbo! 😂</h2>

            <p>
                Aklai vat khai asa? 😭😂
            </p>

            <p>
                Kali muk logot khaba lagbo! 😜🍚
            </p>

            <button class="again" onclick="again()">
                Akou Answer De 😜
            </button>

        </div>

    </div>


    <script>

        function optionA() {

            document.getElementById("question").style.display = "none";

            document.getElementById("answerA").style.display = "block";
        }


        function optionB() {

            document.getElementById("question").style.display = "none";

            document.getElementById("answerB").style.display = "block";
        }


        function again() {

            document.getElementById("answerA").style.display = "none";

            document.getElementById("answerB").style.display = "none";

            document.getElementById("question").style.display = "block";
        }

    </script>

</body>

</html>
