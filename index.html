<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For Dhun ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: Arial, sans-serif;

            background: linear-gradient(135deg, #ff758c, #ff7eb3);

            overflow: hidden;
        }

        .box {
            width: 90%;
            max-width: 550px;
            padding: 40px 25px;

            background: rgba(255, 255, 255, 0.18);
            border-radius: 30px;

            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);

            color: white;
        }

        .heart {
            font-size: 80px;

            animation: heartbeat 1.2s infinite;
        }

        @keyframes heartbeat {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }
        }

        h1 {
            font-size: 42px;
            margin: 15px 0;
        }

        p {
            font-size: 24px;
            line-height: 1.5;
        }

        button {
            border: none;
            padding: 15px 30px;
            margin: 10px;

            border-radius: 30px;

            font-size: 20px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.1);
        }

        .yes {
            background: #ff1744;
            color: white;
        }

        .no {
            background: white;
            color: #ff1744;
        }

        .hidden {
            display: none;
        }

        .small {
            font-size: 20px;
        }

        .back {
            background: white;
            color: #ff4081;
        }

        .floating-heart {
            position: fixed;
            bottom: -50px;
            font-size: 25px;

            animation: floatUp 5s linear forwards;
        }

        @keyframes floatUp {
            from {
                transform: translateY(0);
                opacity: 1;
            }

            to {
                transform: translateY(-110vh);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="box">

        <!-- FIRST MESSAGE -->

        <div id="question">

            <div class="heart">❤️</div>

            <h1>Hey Dhun 😊</h1>

            <p>
                I miss you 🥺
            </p>

            <p>
                <b>Do you miss me too?</b> ❤️
            </p>

            <button class="yes" onclick="yesAnswer()">
                YES ❤️
            </button>

            <button class="no" onclick="noAnswer()">
                NO 😜
            </button>

        </div>


        <!-- YES MESSAGE -->

        <div id="yesMessage" class="hidden">

            <div class="heart">🥰❤️</div>

            <h1>Yayyyy! 😍</h1>

            <p>
                I knew you would say YES! ❤️
            </p>

            <p>
                Now my heart is smiling again 🥺💕
            </p>

            <p>
                <b>Now you smile too 😊</b>
            </p>

            <button class="back" onclick="restart()">
                Again? 😜
            </button>

        </div>


        <!-- NO MESSAGE -->

        <div id="noMessage" class="hidden">

            <div class="heart">😂❤️</div>

            <h1>Ohhh... NO? 😜</h1>

            <p>
                Okay, I'll pretend<br>
                I didn't see that! 🙈
            </p>

            <p>
                But I still miss you ❤️🥺
            </p>

            <p>
                <b>Now smile a little 😊</b>
            </p>

            <button class="back" onclick="restart()">
                Try Again 😜
            </button>

        </div>

    </div>


    <script>

        function yesAnswer() {

            document.getElementById("question").classList.add("hidden");

            document.getElementById("yesMessage").classList.remove("hidden");

            createHearts();
        }


        function noAnswer() {

            document.getElementById("question").classList.add("hidden");

            document.getElementById("noMessage").classList.remove("hidden");

            createHearts();
        }


        function restart() {

            document.getElementById("yesMessage").classList.add("hidden");

            document.getElementById("noMessage").classList.add("hidden");

            document.getElementById("question").classList.remove("hidden");
        }


        function createHearts() {

            for (let i = 0; i < 15; i++) {

                let heart = document.createElement("div");

                heart.className = "floating-heart";

                heart.innerHTML = "❤️";

                heart.style.left = Math.random() * 100 + "vw";

                heart.style.animationDuration =
                    (3 + Math.random() * 3) + "s";

                document.body.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 6000);
            }
        }

    </script>

</body>

</html>
