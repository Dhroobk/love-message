<!DOCTYPE html>
<html>
<head>
    <title>For You ❤️</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .message {
            color: white;
        }

        h1 {
            font-size: 50px;
        }

        p {
            font-size: 30px;
        }

        .heart {
            font-size: 70px;
            animation: beat 1s infinite;
        }

        @keyframes beat {
            50% {
                transform: scale(1.3);
            }
        }
    </style>
</head>

<body>

    <div class="message">
        <div class="heart">❤️</div>

        <h1>I LOVE YOU</h1>

        <p>& MISS YOU 🥺</p>
    </div>

</body>
</html>
